<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
           /* universal selector */
        *{
            background-color: aliceblue;
            margin: 10px;
        }
          /* group selector */
        p,h2{
            background-color: burlywood;
        }
         /* descendant selector */
        div p{
            font-family: sans-serif;
            font-size: 60px;
        }
    </style>
</head>
<body>
    <p>This is Element Selecter</p>
    <h2>This heading tag</h2>
    <div><p>
        hello
    </p></div>
</body>
</html>
