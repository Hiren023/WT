<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         /* universal selector */
        *{
            background-color: aliceblue;
            margin: 10px;
        }
        /* Class selector */
        .classsel{
            background-color: aqua;
        }
        /* id selector */
        #idsel{
            background-color: bisque;
        }
        /* Element selector */
        span{
            background-color: cadetblue;
        }
        /* group selector */
        p,h2{
            background-color: burlywood;
        }
         /* descendant selector */
        div p{
            font-family: sans-serif;
            font-size: 60px;
        }
        /* Child Selector */
        ul>li{
            background-color: whitesmoke;
            color: darkgray;
        }
        /* Adjacent Sibling Selector */
        h1+p{
            background-color: wheat;
        }
        /* Attribute Selector */
        input[type=text]{
            background-color: thistle;
            color: black;
        }

    </style>
</head>
<body>
    <div class="classsel">This is Class Selecter</div>
    <div id="idsel">This is ID Selecter</div>
    <span>Hello</span>
    <p>This is Element Selecter</p>
    <h2>This heading tag</h2>
    <div><p>
        hello
    </p></div>
    <ul>
        <li>Tea</li>
        <li>Milk</li>
    </ul>
    <h1>Hello</h1>
    <p>THis is P</p>    
    <p>THis is P</p>    
    <form action="">
        <input type="text" name="" id="">
        <input type="button" value="Submit">
    </form>
</body>
</html>
