<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Class selector */
        .classsel{
            background-color: aqua;
        }
        /* id selector */
        #idsel{
            background-color: bisque;
        }
        /* Element selector */
        span{
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <div class="classsel">This is Class Selecter</div>
    <div id="idsel">This is ID Selecter</div>
    <span>Hello</span>
</body>
</html>
