<!DOCTYPE html>
<html>
<head>
    <title>HTML Website Layout</title>
  <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
}

.website {
    width: 50%;
    margin: 20px auto;
}

/* Header */
.header {
    height: 55px;
    background-color: #d62828;
    color: white;
    text-align: center;
    padding: 20px;
}

/* Main */
.main {
    height: 220px;
    display: flex;
}

/* Navigation */
.navigation {
    width: 25%;
    background-color: #3035a8;
    color: white;
    text-align: center;
    padding-top: 80px;
}

/* Content */
.content {
    width: 50%;
    background-color: yellow;
    text-align: center;
    padding-top: 80px;
}

/* Sidebar */
.sidebar {
    width: 25%;
    height: 80px;
    background-color: green;
    color: white;
    text-align: center;
    padding-top: 30px;
}

/* Footer */
.footer {
    height: 40px;
    background-color: #20a8d8;
    color: white;
    text-align: center;
    padding: 12px;
}

  </style>
</head>
<body>

<div class="website">

    <!-- Header -->
    <div class="header">
        Header
    </div>

    <!-- Main Section -->
    <div class="main">

        <!-- Navigation -->
        <div class="navigation">
            Navigation
        </div>

        <!-- Content -->
        <div class="content">
            Content
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            Sidebar
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        Footer
    </div>

</div>

</body>
</html>
