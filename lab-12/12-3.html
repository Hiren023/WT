<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">

  
    <div class="row">
        <div class="col-12 bg-danger text-white text-center p-3">
            Header
        </div>
    </div>

    
    <div class="row">

       
        <div class="col-2 bg-primary text-white d-flex align-items-center justify-content-center"
             style="min-height: 330px;">
            Navigation
        </div>

       
        <div class="col-7 bg-warning d-flex align-items-center justify-content-center"
             style="min-height: 330px;">
            Content
        </div>

      
        <div class="col-3">

            <div class="row">
                <div class="col-12 bg-success text-white d-flex align-items-center justify-content-center"
                     style="height: 140px;">
                    Sidebar
                </div>  
            </div>

        </div>

    </div>

    <div class="row">
        <div class="col-12 bg-info text-white text-center p-3">
            Footer
        </div>
    </div>

</div>

</body>
</html>
