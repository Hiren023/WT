<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container-fluid border border-primary p-0">

    <!-- Header -->
    <div class="row g-0 border-bottom border-success border-2">
        <div class="col-2 border-end border-danger border-2 p-2 fs-5">
            Logo Here
        </div>

        <div class="col-10 p-2">
            <a href="#" class="me-3">Home</a>
            <a href="#" class="me-3">About</a>
            <a href="#">Contact</a>
        </div>
    </div>


    
    <div class="row g-0">

        <!-- Sidebar -->
        <div class="col-3 border-end border-warning border-2 p-2">

            <div class="border border-secondary p-2 text-center mb-3">
                RESULT
            </div>

            <div class="border border-secondary p-2 text-center mb-3">
                APPLY
            </div>

            <div class="border border-secondary p-2 text-center mb-3">
                PLACEMENT
            </div>

            <div class="border border-secondary p-2 text-center mb-3">
                RECRUITMENT
            </div>

            <div class="border border-secondary p-2 text-center">
                NEWS
            </div>

        </div>


        
        <div class="col-9 p-4">

            <!-- First Box -->
            <div class="border border-2 border-primary p-4 mb-3">

                <div class="row justify-content-around">

                    <div class="col-5 border border-danger border-2 border-dotted p-4">
                        &nbsp;
                    </div>

                    <div class="col-5 border border-danger border-2 border-dotted p-4">
                        &nbsp;
                    </div>

                </div>

            </div>


           
            <div class="border border-2 border-primary p-4">

                <div class="row justify-content-around">

                    <div class="col-3 border border-danger border-2 p-4">
                        &nbsp;
                    </div>

                    <div class="col-3 border border-danger border-2 p-4">
                        &nbsp;
                    </div>

                    <div class="col-3 border border-danger border-2 p-4">
                        &nbsp;
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Footer -->
    <div class="row g-0 border-top border-primary border-2">
        <div class="col-12 text-center p-2 fs-5">
            Footer
        </div>
    </div>

</div>

</body>
</html>
