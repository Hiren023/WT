<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 100px;
            background-color: rgb(24, 97, 198);
            animation: custome;
            animation-duration: 1s;
            border-radius: 1;
        }

        @keyframes custome {
        
            0%{
                background-color: brown;
               
            }
            25%{
                background-color: blueviolet;
                margin-left: 100px;
                margin-top: 0px;
            }
            50%{
                background-color: rgb(43, 226, 180);
                margin-left: 100px;
                margin-top: 100px; 
            }
            100%{
                background-color: rosybrown;
                margin-bottom: 1000px;
                margin-left: 0px;
                margin-top: 100px;
            }

        }
    </style>
</head>

<body>
    <div class="container"></div>
</body>

</html>
