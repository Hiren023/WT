<body>

    <article id="try">
        <section>
            <header>
                <h2>Course Enrollment & Feedback Pannel</h2>
                <p></p>
            </header>
        </section>
    </article>

    <article id="try">
        <section id="A">
            <header>
                <h2>1.contac form</h2>
                </header>
                <form>
                    <table>
                        <tr>
                            <td><label for="name">Name:</label></td>
                            <td><input type="text" required placeholder="Your Full Name"></td>
                        </tr>
                        <tr>
                            <td><label for="Email">Email:</label></td>
                            <td><input type="email" required placeholder="name@domain.com"></td>
                        </tr>
                        <tr>
                            <td><label for="phone number">Phone Number</label></td>
                            <td><input type="tel" required name="phone number" id=""></td>
                        </tr>
                        <tr>
                            <td><label for="Birthdate">Phone Number</label></td>
                            <td><input type="date" required name="Birthdate" id=""></td>
                        </tr>
                        <tr>
                            <td><label for="add">Address</label></td>
                            <td><textarea name="" required  rows="4" cols="21" id=""></textarea></td>
                        </tr>  
                        <tr>
                            <td><button>submitt</button></td>
                        </tr>
                    </table>
                </form>
            </header>
        </section>
    </article>

    <article id="trye">
        <section id="B">
            <header>
                <h2>2.Regirstaion Form</h2>
            </header>
            <form>
                <table>
                    <tr>
                        <td><label for="Account Email">Account Email:</label></td>
                        <td><input type="email required"></td>
                    </tr>
                    <tr>
                        <td><label for="Age">Age Varfication:</label></td>
                        <td><input type="number" required placeholder="Min 18" minlength="18"></td>
                    </tr>
                    <tr>
                    <td><label for="Password">Password Varfication:</label></td>
                    <td><input type="text" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" required></td>
                    </tr>
                    <tr>
                        <td><button>Regirstaion Account</button></td>
                    </tr>
                </table>
            </form>
        </section>
    </article>


    <article id="tru">
        <section id="C">
            <header>
                <h2>3.Course Feedback Form</h2>
            </header>
            <form >
                <table>
                    <tr>
                        <td><label for="course">Course Code Name:</label></td>
                        <td><input type="text" required placeholder="5 to 20 charcters" minlength="5" maxlength="20"></td>
                    </tr>  <tr>
                        <td><label for="Rating">Ratig Score:</label></td>
                        <td><input type="number" required placeholder="value"></td>
                    </tr>

                    </tr>
